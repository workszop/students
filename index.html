<style>
  @keyframes boot-reveal { to { visibility: visible; } }
  html:not(.app-ready) body { visibility: hidden; animation: boot-reveal 0s 4s forwards; }
  @media print { html:not(.app-ready) body { visibility: visible; animation: none; } }

<style>
/* ============================================================
   edulab - Colors & Type foundation
   Fonts (Outfit, IBM Plex Sans, Roboto Mono) load from Google Fonts
   via the <link> tags in tokens/head.html - paste that into <head>.
   No @import here: it chains requests and blocks rendering.
   ============================================================ */

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper - page background is white; the stone steps are bands / wells.
     Warm neutral grey (no yellow cast) so yellow and the colour blocks stay the
     loudest thing on the page. Stone v2 (2026-10-10) replaced the cream sand
     (#FBF7E6 / #F5EDCB), which at 1.07:1 on white did not read as a surface. */
  --paper:    #FFFFFF;   /* page background (white)                       */
  --paper-2:  #F5F3F0;   /* stone band: alternating sections, card heads   */
  --paper-3:  #EAE6E0;   /* deepest stone: wells, table heads, bar tracks  */
  --surface:  #FFFFFF;   /* cards & sheets                                */

  /* Ink - warm near-black text & lines */
  --ink:      #1C1917;   /* primary text                                    */
  --ink-2:    #44403C;   /* secondary text, 10.3:1 on white                 */
  --ink-3:    #625B53;   /* muted / placeholder: >= 4.5:1 on every paper step */
  --line:     #E0DBD3;   /* hairline: dividers, table rows, card heads      */
  --line-2:   #C9C2B7;   /* stronger: card contours, section rules          */
  --line-strong: #857C69;/* control boundaries (inputs, ghost buttons,
                            answer options): >= 3:1 on paper steps (WCAG 1.4.11) */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. The base colour (--blue) is for large fills,
     illustrations and large text (>= 24px, or 19px bold). "-soft" is the
     solid fill for chips and panels that carry small text: it is the
     AA shade (= "-600"), so its "-ink" (white; dark ink on yellow) reaches
     4.5:1. A colour used AS text goes only on white and uses "-600".
     Never colour-on-colour (no green text on green).
     Gate: python3 scripts/check-contrast.py */

  /* Yellow - primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue - secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #177AA8;   /* = blue-600, white text 4.8:1 */
  --blue-ink:  #FFFFFF;

  /* Green - secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #078342;  /* hover / press, AA text shade */
  --green-soft: #078342;  /* = green-600, white text 4.9:1 */
  --green-ink:  #FFFFFF;

  /* Red - danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #C92823;   /* = red-600, white text 5.5:1 */
  --red-ink:  #FFFFFF;

  /* Grape - 5th category tone (colour-coded groups), from the play palette */
  --grape:      #7A5AC2;
  --grape-soft: #7A5AC2;  /* white text 5.2:1 */
  --grape-ink:  #FFFFFF;

  /* Legacy role aliases - older edulab apps use these names */
  --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
  --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
  --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
  --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

  /* Play palette - subject/category colours in the kids app */
  --play-sun:    #FFD500;
  --play-grass:  #00A651;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #1E8FC2;
  --play-coral:  #E5322D;

  /* ---- Semantic ---- */
  --success:      #00A651;  --success-soft: #078342;  --success-ink: #FFFFFF;
  --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
  --danger:       #E5322D;  --danger-soft:  #C92823;  --danger-ink:  #FFFFFF;
  --info:         #1E8FC2;  --info-soft:    #177AA8;  --info-ink:    #FFFFFF;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--yellow);
  --on-primary:#1C1917;      /* dark text on yellow */
  /* White gap + ink band: >= 3:1 on paper, sand, yellow and every chip fill.
     Pair with `outline: 3px solid transparent` so forced-colours mode still shows focus. */
  --focus-ring: 0 0 0 2px var(--paper), 0 0 0 5px var(--ink);
  /* Range-slider track */
  --track: color-mix(in srgb, var(--ink) 24%, transparent);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  /* Page gutter (user decision 2026-11-07): content ~70% of the viewport on wide screens
     (15% margin each side from ~1280px), never squeezed below 900px, 16-72px on phones/tablets.
     Every full-width band, header row, page head and footer pads its content with it. */
  --gutter: max(clamp(16px, 4vw, 72px), min(15vw, calc((100vw - 900px) / 2)));
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation - warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.10), 0 2px 6px rgba(33,30,26,.06);
  --shadow-md: 0 6px 18px rgba(33,30,26,.12), 0 1px 3px rgba(33,30,26,.08);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --shadow-marigold: var(--shadow-primary);   /* legacy alias */

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   Element defaults are wrapped in :where(.edu) (zero specificity) so any
   single class wins: <p class="edu-overline">, <p class="edu-small">,
   <h1 class="app-title"> keep their own font/size instead of the element default.
   ============================================================ */

.edu-display, :where(.edu) h1.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--display-font);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
}
:where(.edu) h1, .edu-h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
:where(.edu) h2, .edu-h2 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
:where(.edu) h3, .edu-h3 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
:where(.edu) h4, .edu-h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
:where(.edu) p, .edu-p, .edu-body {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }

/* Overline - mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
:where(.edu) code, .edu-mono {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

</style>
<style>
/* ─── Layout ─── */
:root { --stick: 70px; }
body { margin: 0; padding: 0; background: var(--paper); }
.wrap { padding: 0 var(--gutter); }
:focus-visible { outline: 3px solid transparent; box-shadow: var(--focus-ring); }
[hidden] { display: none !important; }

/* ─── Top menu (no clickable control: scrolls away) ─── */
.edu-header { position: static; width: 100%; background: var(--paper); border-bottom: 1px solid var(--line-2); }
.edu-header-inner { padding: 8px var(--gutter); display: flex; align-items: center; gap: 12px; }
.edu-logo { width: 64px; height: 64px; display: block; margin-right: -6px; }
.edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }

/* ─── Page head ─── */
.page-head { padding: 44px var(--gutter) 36px; text-align: left; }
.app-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.3rem, 5vw, 3.3rem); letter-spacing: -.025em; line-height: 1.05; color: var(--ink); margin: 0 0 14px; }
.edu-lead { font-size: 1.15rem; line-height: 1.6; color: var(--ink-2); margin: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 24px; }
.search { flex: 1; min-width: 220px; max-width: 460px; box-sizing: border-box; font: inherit; font-family: var(--font-sans); padding: 10px 16px; border: 1px solid var(--line-strong); border-radius: var(--r-pill); background: var(--surface); color: var(--ink); }
.ghost { flex: none; font-family: var(--font-sans); font-weight: 600; font-size: var(--body-sm); color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-pill); padding: 9px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.ghost:hover { background: var(--paper-3); }
.fold-all { margin-left: auto; }

/* ─── "Can this browser run AI models" check (solid chip, click to re-run) ─── */
.gpu { border: 0; cursor: pointer; text-align: left; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: var(--r-lg); font-family: var(--font-sans); font-weight: 600; font-size: var(--body-sm); line-height: 1.35; background: var(--paper-3); color: var(--ink); }
.gpu[data-state="ok"] { background: var(--green-soft); color: var(--green-ink); }
.gpu[data-state="maybe"] { background: var(--yellow-soft); color: var(--yellow-ink); }
.gpu[data-state="no"] { background: var(--red-soft); color: var(--red-ink); }
.gpu[data-state="wait"] .ic { animation: gpu-pulse .8s ease-in-out infinite alternate; }
@keyframes gpu-pulse { from { opacity: .25; } to { opacity: 1; } }

/* ─── Part navigation (sticky: it has controls) ─── */
.strip { position: sticky; top: 0; z-index: 50; background: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line-2); }
.pills { display: flex; gap: 2px; overflow-x: auto; padding: 8px 4px; margin: 0 -4px; scrollbar-width: none; }
.pills::-webkit-scrollbar { display: none; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; font-family: var(--font-sans); font-weight: 600; font-size: var(--body-sm); color: var(--ink-2); padding: 8px 12px; border-radius: var(--r-pill); cursor: pointer; }
.pill .ic { width: 16px; height: 16px; }
.pill:hover { background: var(--paper-2); }
.pill.on { background: var(--yellow); color: var(--yellow-ink); }

/* ─── Tones, badges, chips ─── */
.tone-grape  { background: var(--grape-soft);  color: var(--grape-ink); }
.tone-blue   { background: var(--blue-soft);   color: var(--blue-ink); }
.tone-yellow { background: var(--yellow-soft); color: var(--yellow-ink); }
.tone-green  { background: var(--green-soft);  color: var(--green-ink); }
.tone-red    { background: var(--red-soft);    color: var(--red-ink); }
.tone-ink    { background: var(--ink);         color: var(--paper); }
.tone-stone  { background: var(--paper-3);     color: var(--ink); }
.ic { width: 18px; height: 18px; flex: none; }
.badge { flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); display: inline-grid; place-items: center; }
.badge-lg { width: 46px; height: 46px; border-radius: var(--r-md); }
.badge-lg .ic { width: 24px; height: 24px; }
.badge.tone-ink { color: var(--yellow); }
.tile-h { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tile-h h3 { margin: 0; font-size: 18px; line-height: 1.3; }
.chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: var(--r-pill); white-space: nowrap; background: var(--paper-3); color: var(--ink); }
.chip-here { background: var(--yellow); color: var(--yellow-ink); }
body[data-models="no"] .chip-webgpu { background: var(--red-soft); color: var(--red-ink); }
body[data-models="maybe"] .chip-webgpu { background: var(--yellow-soft); color: var(--yellow-ink); }
body[data-models="ok"] .chip-webgpu { background: var(--green-soft); color: var(--green-ink); }

/* ─── Section bands (collapsible) ─── */
main { padding: 0; }
.sec { margin: 0; padding: 52px 0 60px; border-top: 1px solid var(--line); scroll-margin-top: var(--stick); }
.sec:first-child { border-top: 0; }
.sec:nth-of-type(odd) { background: var(--paper-2); }
.sec-head { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; cursor: pointer; user-select: none; }
.sec-head h2 { margin: 0; }
.sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line-2); order: 1; }
.sec-toggle { all: unset; cursor: pointer; border-radius: var(--r-xs); }
.sec-toggle:focus-visible { box-shadow: var(--focus-ring); }
.sec-meta { order: 2; flex: none; font-family: var(--font-mono); font-size: var(--body-sm); color: var(--ink-3); }
.sec-chev { order: 3; flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-pill); border: 1px solid var(--line-strong); color: var(--ink-2); background: var(--surface); transition: transform .2s ease; }
.sec-head:hover .sec-chev { background: var(--paper-3); }
.sec.collapsed { padding: 18px 0; }
.sec.collapsed .sec-head { margin-bottom: 0; }
.sec.collapsed .sec-chev { transform: rotate(-90deg); }
.sec.collapsed .sec-body { display: none; }
.sec-body { animation: fold-in .2s ease; }
@keyframes fold-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.group-hero { border-radius: var(--r-xl); padding: 26px 30px; margin-bottom: 20px; }
.group-hero .edu-overline { color: inherit; margin: 0 0 8px; }
.group-hero .lead { margin: 0; font-size: var(--body-lg); line-height: 1.55; }
.group-hero.tone-ink .edu-overline { color: var(--yellow); }

/* ─── App cards: stone head, screenshot, body, dashed foot ─── */
.blk { display: grid; grid-template-columns: 200px 1fr; gap: 10px 20px; padding: 18px 0; border-top: 1px solid var(--line-2); }
.blk:first-child { border-top: 0; padding-top: 0; }
.blk-l { margin: 14px 0 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; display: flex; flex-direction: column; }
a.card { text-decoration: none; color: var(--ink); transition: border-color .15s ease; }
a.card:hover { border-color: var(--ink); }
.card-head { padding: 12px 18px; background: var(--paper-2); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-head > .ic { color: var(--ink-3); }
a.card:hover .card-head > .ic { color: var(--ink); }
.app-img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; object-position: top left; background: var(--paper-2); border-bottom: 1px solid var(--line); }
.card-body { padding: 14px 18px 16px; flex: 1; }
.card-body p { margin: 0; font-size: var(--body-sm); line-height: 1.5; }
.app-p { display: block; margin: 0 0 6px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.card-foot { padding: 10px 18px; border-top: 1px dashed var(--line-2); display: flex; align-items: center; gap: 10px; }
/* A part with a single class app shows it as one wide card */
.cards.solo { grid-template-columns: minmax(0, 900px); }
.cards.solo .card { display: grid; grid-template-columns: 54% 1fr; grid-template-rows: auto 1fr auto; }
.cards.solo .card-head { grid-column: 1 / -1; }
.cards.solo .app-img { grid-row: 2 / 4; height: 100%; border-bottom: 0; border-right: 1px solid var(--line); }
.cards.solo .card-body { padding: 22px 24px; }
.cards.solo .card-body p { font-size: var(--body); }
.cards.solo .tile-h h3 { font-size: 22px; }

/* ─── Optional apps: smaller cards under a ruled sub-head ─── */
.sub-head { display: flex; align-items: center; gap: 14px; margin: 34px 0 18px; }
.sub-head .edu-overline { margin: 0; }
.sub-head::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.cards.small { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.cards.small .card-head { padding: 10px 14px; }
.cards.small .badge { width: 28px; height: 28px; border-radius: var(--r-xs); }
.cards.small .badge .ic { width: 15px; height: 15px; }
.cards.small .tile-h { gap: 10px; }
.cards.small .tile-h h3 { font-size: 15px; }
.cards.small .card-body { padding: 10px 14px 12px; }
.cards.small .card-body p { font-size: var(--caption); }
.cards.small .card-foot { padding: 8px 14px; }
.empty { padding: 28px 0 60px; margin: 0; color: var(--ink-3); }

footer { border-top: 1px solid var(--line); }
footer .wrap { padding-top: 24px; padding-bottom: 40px; font-family: var(--font-sans); font-size: var(--body-sm); color: var(--ink-3); }

@media (max-width: 768px) {
  .edu-header-inner { padding: 6px var(--gutter); }
  .page-head { padding: 28px var(--gutter) 32px; }
  .search { max-width: none; flex-basis: 100%; } .fold-all { margin-left: 0; }
  .sec { padding: 36px 0 44px; } .sec.collapsed { padding: 14px 0; }
  .sec-head { flex-wrap: wrap; } .sec-head h2 { flex: 1; min-width: 0; font-size: var(--h3); }
  .sec-head::after { flex: 1 0 100%; order: 4; } .sec-meta { display: none; }
  .group-hero { padding: 22px; }
  .blk { grid-template-columns: 1fr; } .blk-l { margin-top: 0; }
  .cards, .cards.solo { grid-template-columns: 1fr; }
  .cards.small { grid-template-columns: 1fr 1fr; gap: 10px; }
  .cards.solo .card { display: flex; }
  .cards.solo .app-img { height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .cards.solo .card-body { padding: 14px 18px 16px; } .cards.solo .card-body p { font-size: var(--body-sm); } .cards.solo .tile-h h3 { font-size: 18px; }

const GPU_TIMEOUT_MS = 5000;   // a browser that never answers counts as "cannot run models"
const GPU_MIN_SHOW_MS = 600;   // keep "checking" on screen long enough to be seen
const GPU_TEXT = {
  wait: 'Sprawdzam, czy ta przeglądarka uruchomi modele AI',
  ok: 'Ta przeglądarka może uruchamiać modele AI',
  maybe: 'W tej przeglądarce modele AI mogą się nie uruchomić. Aplikacje z oznaczeniem WebGPU otwórz w Chrome lub Edge',
  'no-api': 'Ta przeglądarka nie uruchomi modeli AI. Aplikacje z oznaczeniem WebGPU otwórz w Chrome lub Edge',
  'no-gpu': 'Na tym komputerze modele AI się nie uruchomią: przeglądarka nie może liczyć na karcie graficznej (WebGPU)',
};
// WGSL smoke test: a compute shader must really run on the GPU and return the right numbers.
const GPU_TEST_WGSL = '@group(0) @binding(0) var<storage, read_write> d: array<f32>;'
  + ' @compute @workgroup_size(4) fn main(@builtin(global_invocation_id) id: vec3u) { d[id.x] = d[id.x] * 2.0 + 1.0; }';
const GPU_TEST_IN = [1, 2, 3, 4];
const GPU_TEST_OUT = '3,5,7,9';
const SLUG_RE = /\s*\(([a-z0-9]+[_-][a-z0-9_-]+|difu|qwen|aicalc)\)$/;
// Real screenshots of every app live in shots/<name>.webp (800x500); the name is derived from the app URL.
const shotName = url => url.replace(/^https?:\/\//, '').replace(/\/$/, '').toLowerCase().replace(/[^a-z0-9_]+/g, '-').replace(/^-|-$/g, '');

// ─── Derived data ───
PARTS.forEach(p => {
  p.blocks.forEach(b => {
    b.apps = b.items.map(([kind, title, url, note]) => ({
      kind, url, part: p, icon: b.icon,
      title: title.replace(SLUG_RE, ''),
      note: note.replace(/\s*\(EN\)/, ''),
      en: /\(EN\)/.test(note),
      webgpu: /WebGPU/.test(note),
      shot: shotName(url),
    }));
  });
});

// ─── State ───
// The page always opens with every part folded; a #part link opens that one part.
const state = { here: null, query: '', closed: new Set(PARTS.map(p => p.id)), gpu: 'wait', gpuRun: 0, spy: null };

// ─── DOM refs ───

// ─── Helpers ───
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ic = name => '<i data-lucide="' + name + '" class="ic" aria-hidden="true"></i>';
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
const wait = ms => new Promise(r => setTimeout(r, ms));
function icons(root = document) { if (window.lucide) window.lucide.createIcons({ root }); }
const partById = id => PARTS.find(p => p.id === id);
const appsOf = (p, kind) => p.blocks.flatMap(b => b.apps).filter(a => !kind || a.kind === kind);
const matchesQ = a => norm([a.title, a.note, a.url].join(' ')).includes(norm(state.query));
const countsOf = p => appsOf(p, 'core').length + ' na zajęciach · ' + appsOf(p, 'support').length + ' dla chętnych';

function chipsHtml(a, withOpt) {
  const f = [];
  if (withOpt && a.kind === 'support') f.push('<span class="chip">Dla chętnych</span>');
  if (a.webgpu) f.push('<span class="chip chip-webgpu" title="Model AI działa na Twoim komputerze, potrzebna przeglądarka z WebGPU">WebGPU</span>');
  if (a.en) f.push('<span class="chip" title="Aplikacja tylko po angielsku">EN</span>');
  return f.length ? '<span class="chips">' + f.join('') + '</span>' : '';
}
function cardHtml(a, o = {}) {
  const chips = chipsHtml(a, o.opt);
  return '<a class="card" data-app data-kind="' + a.kind + '" href="' + esc(a.url) + '" target="_blank" rel="noopener">'
    + '<div class="card-head"><span class="tile-h"><span class="badge ' + a.part.tone + '">' + ic(a.icon) + '</span><h3>' + esc(a.title) + '</h3></span>' + ic('arrow-up-right') + '</div>'
    + (o.img ? '<img class="app-img" src="shots/' + a.shot + '.webp" width="800" height="500" loading="lazy" alt="Zrzut ekranu aplikacji ' + esc(a.title) + '">' : '')
    + '<div class="card-body">' + (o.part ? '<span class="app-p">' + esc(a.part.title) + '</span>' : '') + '<p>' + esc(a.note) + '</p></div>'
    + (chips ? '<div class="card-foot">' + chips + '</div>' : '') + '</a>';
}
// Apps of one kind in a part as screenshot cards; multi-block parts keep their sub-topics as labelled rows.
function groupHtml(p, kind) {
  const multi = p.blocks.length > 1;
  const cls = kind === 'support' ? ' small' : appsOf(p, 'core').length === 1 ? ' solo' : '';
  const out = p.blocks.map(b => {
    const apps = b.apps.filter(a => a.kind === kind);
    if (!apps.length) return '';
    const cards = '<div class="cards' + cls + '">' + apps.map(a => cardHtml(a, { img: true })).join('') + '</div>';
    return multi ? '<div class="blk"><p class="blk-l edu-overline">' + esc(b.title) + '</p>' + cards + '</div>' : cards;
  }).join('');
  return multi ? '<div class="blks">' + out + '</div>' : out;
}
function optHtml(p) {
  if (!appsOf(p, 'support').length) return '';
  return '<div class="sub-head"><p class="edu-overline">Dla chętnych</p></div>' + groupHtml(p, 'support');
}

// ─── Render ───
function renderStatic() {
  pillsEl.innerHTML = PARTS.map(p => '<button type="button" class="pill" data-go="' + p.id + '">' + ic(p.icon) + esc(p.short) + '</button>').join('');
}
function pathHtml() {
  return PARTS.map(p => {
    const here = p.id === state.here;
    return '<section class="sec" id="' + p.id + '" data-part="' + p.id + '"><div class="wrap">'

  }).join('');
}
function resultsHtml() {
  const hits = PARTS.flatMap(p => appsOf(p)).filter(matchesQ);
  if (!hits.length) return '<div class="wrap"><p class="empty">Brak aplikacji pasujących do wyszukiwania.</p></div>';
  return '<section class="sec" data-results><div class="wrap"><div class="cards">' + hits.map(a => cardHtml(a, { part: true, opt: true })).join('') + '</div></div></section>';
}
function applyFold() {
  viewEl.querySelectorAll('.sec[data-part]').forEach(sec => {
    const open = !state.closed.has(sec.dataset.part);
    sec.classList.toggle('collapsed', !open);
    sec.dataset.open = String(open);
    sec.querySelector('.sec-toggle').setAttribute('aria-expanded', String(open));
  });
  const anyOpen = PARTS.some(p => !state.closed.has(p.id));
  foldAllEl.dataset.action = anyOpen ? 'collapse' : 'expand';
  foldAllEl.innerHTML = ic(anyOpen ? 'chevrons-down-up' : 'chevrons-up-down') + (anyOpen ? 'Zwiń wszystkie' : 'Rozwiń wszystkie');
  foldAllEl.hidden = state.query !== '';
  icons(foldAllEl);
}
function applyPills() {
  const on = state.spy || state.here;
  pillsEl.querySelectorAll('.pill').forEach(b => {
    const active = !state.query && b.dataset.go === on;
    b.classList.toggle('on', active);
    active ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current');
  });
}
function applyGpu() {
  const s = state.gpu, cls = s.startsWith('no') ? 'no' : s;
  gpuEl.dataset.state = cls;
  gpuEl.dataset.result = s;
  gpuEl.innerHTML = ic(cls === 'ok' ? 'circle-check' : cls === 'wait' ? 'loader' : 'triangle-alert') + '<span>' + esc(GPU_TEXT[s]) + '</span>';
  if (s === 'wait') delete document.body.dataset.models; else document.body.dataset.models = cls;
  icons(gpuEl);
}
function render() {
  viewEl.innerHTML = state.query ? resultsHtml() : pathHtml();
  document.body.dataset.here = state.here || '';
  document.body.dataset.shown = viewEl.querySelectorAll('[data-app]').length;
  document.body.dataset.total = PARTS.flatMap(p => appsOf(p)).length;
  applyFold();
  applyPills();
  icons(viewEl);
}
function toggleSec(id) {
  state.closed.has(id) ? state.closed.delete(id) : state.closed.add(id);
  applyFold();
}
function setAll(open) {
  state.closed = open ? new Set() : new Set(PARTS.map(p => p.id));
  applyFold();
}
function goPart(id) {
  if (!partById(id)) return;
  state.here = id; state.spy = null; state.closed.delete(id);
  if (state.query) { state.query = ''; searchEl.value = ''; }
  try { history.replaceState(null, '', '#' + id); } catch {}
  render();
  document.getElementById(id)?.scrollIntoView({ block: 'start' });
}
function spy() {
  if (state.query) return;
  let cur = null;
  viewEl.querySelectorAll('[data-part]').forEach(s => { if (s.getBoundingClientRect().top < 130) cur = s.dataset.part; });
  if (cur !== state.spy) { state.spy = cur; applyPills(); }
}
// The apps run models with WebGPU and are built for Chromium browsers (Chrome, Edge).
const isChromium = () => !!navigator.userAgentData?.brands?.some(b => b.brand === 'Chromium');
async function gpuComputes(device) {
  const pipeline = await device.createComputePipelineAsync({ layout: 'auto', compute: { module: device.createShaderModule({ code: GPU_TEST_WGSL }), entryPoint: 'main' } });
  const bytes = GPU_TEST_IN.length * 4;
  const data = device.createBuffer({ size: bytes, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
  const read = device.createBuffer({ size: bytes, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(data, 0, new Float32Array(GPU_TEST_IN));
  const enc = device.createCommandEncoder();
  const pass = enc.beginComputePass();
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: data } }] }));
  pass.dispatchWorkgroups(1);
  pass.end();
  enc.copyBufferToBuffer(data, 0, read, 0, bytes);
  device.queue.submit([enc.finish()]);
  await read.mapAsync(GPUMapMode.READ);
  const out = Array.from(new Float32Array(read.getMappedRange().slice(0))).join(',');
  read.unmap();
  return out === GPU_TEST_OUT;
}
// ok = Chromium + the GPU really computes; maybe = the GPU computes but the browser is not Chromium;
// no-api = no WebGPU in the browser; no-gpu = no adapter, no device, or the computation failed.
async function probeModels() {
  if (!navigator.gpu) return 'no-api';
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) return 'no-gpu';
    const device = await adapter.requestDevice();
    const computes = await gpuComputes(device);
    device.destroy();
    if (!computes) return 'no-gpu';
  } catch { return 'no-gpu'; }
  return isChromium() ? 'ok' : 'maybe';
}
async function checkGpu() {
  const run = ++state.gpuRun;
  state.gpu = 'wait'; applyGpu();
  const [result] = await Promise.all([
    Promise.race([probeModels(), wait(GPU_TIMEOUT_MS).then(() => 'no-gpu')]),
    wait(GPU_MIN_SHOW_MS),
  ]);
  if (run !== state.gpuRun) return;
  state.gpu = result; applyGpu();
}

// ─── Listeners ───
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { goPart(go.dataset.go); return; }
  const fold = e.target.closest('[data-fold]');
  if (fold) toggleSec(fold.dataset.fold);
});
gpuEl.addEventListener('click', checkGpu);
foldAllEl.addEventListener('click', () => setAll(foldAllEl.dataset.action === 'expand'));
searchEl.addEventListener('input', () => { state.query = searchEl.value.trim(); render(); });
document.addEventListener('keydown', e => {
  const inField = e.target === searchEl;
  if (e.key === 'Escape' && state.query) { searchEl.value = ''; state.query = ''; render(); if (inField) searchEl.blur(); return; }
  if (inField || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); searchEl.focus(); }
});
let spyQueued = false;
addEventListener('scroll', () => { if (spyQueued) return; spyQueued = true; requestAnimationFrame(() => { spyQueued = false; spy(); }); }, { passive: true });
addEventListener('hashchange', () => { const id = location.hash.slice(1); if (partById(id) && id !== state.here) goPart(id); });
addEventListener('load', () => icons());

// ─── Init ───
if (partById(location.hash.slice(1))) { state.here = location.hash.slice(1); state.closed.delete(state.here); }
renderStatic();
render();
icons();
checkGpu();
if (state.here) document.getElementById(state.here)?.scrollIntoView({ block: 'start' });

  new Promise(r => setTimeout(r, FONT_WAIT_MS)),
]).then(() => document.documentElement.classList.add('app-ready'));
</script>
